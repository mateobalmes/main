<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.birds.min.js"></script>
    <script>
      window.addEventListener("DOMContentLoaded", () => {
        VANTA.BIRDS({
          el: "#vanta",
          mouseControls: true,
          touchControls: true,
          gyroControls: false,
          minHeight: 200.0,
          minWidth: 200.0,
          scale: 1.0,
          scaleMobile: 1.0,
          backgroundAlpha: 0.0,
          color2: 0xff00f0,
          wingSpan: 40.0,
          separation: 100.0,
          alignment: 77.0,
          cohesion: 5.0,
          quantity: 2.0,
        });
        setTimeout(() => {
          const main = document.querySelector("main");
          main.style.opacity = 1;
          main.style.filter = "blur(0px)";
        }, 1000);
      });
    </script>
    <title>Mateo Balmes</title>
  </head>
  <body>
    <div id="vanta"></div>
    <main>
      <header>
        <img
          src="mateo.png"
          alt="GitHub avatar"
        />
        <h1>@mateo.balmes</h1>
      </header>
      <ul>
        <li>
          <a
            href="http://mateo.com.de"
            target="_blank"
            rel="noreferrer noopener"
          >
            <img
              src="assets/images/homepage.svg"
              alt="home button"
              width="20"
            />

          </a>
        </li>
            <li>
          <a
            href="https://www.radiatetheworld.com/peeps/1250284/?can_friend_peep=1&_branch_match_id=1528164978970070003&_branch_referrer=H4sIAAAAAAAAA8soKSkottLXL0pMyUwsSdVLLCjQy8nMy9YvKLa0rEjN8CmMSrKvK0pNSy0qysxLj08qyi8vTi2ydc4oys9NBQDo2D%2BdPgAAAA%3D%3D"
            target="_blank"
            rel="noreferrer noopener"
          >

            Radiate
          </a>
        </li>
        <li>
          <a
            href="http://winterai.ca"
            target="_blank"
            rel="noreferrer noopener"

  </body>
</html>
